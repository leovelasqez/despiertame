name: Compilar iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Despiertame
  PROJECT: Despiertame.xcodeproj

jobs:
  test:
    name: Pruebas unitarias (simulador)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Ejecutar pruebas en simulador
        run: |
          set +e
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 \
            | tee test.log \
            | grep -E --line-buffered "(error|warning): |Test Case|Test Suite|Executed|Failing tests|TEST (FAILED|SUCCEEDED)|BUILD (FAILED|SUCCEEDED)|XCTAssert"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Últimas 300 líneas del log completo"
            tail -n 300 test.log
            echo "::endgroup::"
          fi
          exit $status

      - name: Subir log de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7

  build:
    name: Compilar IPA sin firmar
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar (Release, dispositivo, sin firma)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Despiertame.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Despiertame.ipa Payload
          ls -la Despiertame.ipa

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Despiertame-ipa
          path: Despiertame.ipa
          retention-days: 30

      - name: Publicar release (rama main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" Despiertame.ipa \
            --title "Despiértame · build ${{ github.run_number }}" \
            --notes "IPA sin firmar para instalar con AltStore o SideStore. Commit ${{ github.sha }}." \
            --latest
