# Definición del proyecto Xcode para XcodeGen.
# En CI se ejecuta `xcodegen generate` para producir Despiertame.xcodeproj.
name: Despiertame

options:
  bundleIdPrefix: dev.leovelasqez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    # Sin firma: el .ipa se firma después con AltStore / SideStore.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: "YES"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Despiertame:
    type: application
    platform: iOS
    sources:
      - path: Despiertame
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leovelasqez.despiertame
        PRODUCT_NAME: Despiertame
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: Despiertame/Info.plist
      properties:
        CFBundleDisplayName: Despiértame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: >-
          Despiértame usa tu ubicación para medir la distancia a tu destino
          y hacer sonar la alarma cuando estés llegando.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Con el permiso "Siempre", Despiértame puede seguir vigilando tu destino
          con la pantalla bloqueada y volver a activarse si el sistema la cierra.
          Sin él, la alarma solo funciona mientras la app siga abierta en segundo plano.
        NSLocationTemporaryUsageDescriptionDictionary:
          PrecisionRequired: >-
            La alarma necesita ubicación precisa para sonar en el punto correcto.

  DespiertameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DespiertameTests
    dependencies:
      - target: Despiertame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leovelasqez.despiertame.tests
        GENERATE_INFOPLIST_FILE: "YES"

  DespiertameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DespiertameUITests
    dependencies:
      - target: Despiertame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leovelasqez.despiertame.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Despiertame

schemes:
  DespiertameDemo:
    build:
      targets:
        Despiertame: all
        DespiertameUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DespiertameUITests

  Despiertame:
    build:
      targets:
        Despiertame: all
        DespiertameTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DespiertameTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
